name: Verify recommendation system
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: cp artifacts/model_metrics.csv /tmp/reference-model-metrics.csv
      - run: python -m src.run_pipeline
        env:
          MPLBACKEND: Agg
      - name: Verify metric reproducibility
        run: |
          python - <<'PYCODE'
          import pandas as pd
          expected = pd.read_csv('/tmp/reference-model-metrics.csv')
          actual = pd.read_csv('artifacts/model_metrics.csv')
          pd.testing.assert_frame_equal(expected, actual, check_exact=False, atol=1e-10, rtol=0)
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: recommendation-evaluation
          path: |
            artifacts/model_metrics.csv
            artifacts/evaluation_details.csv
            artifacts/run_summary.json
            reports/EXPERIMENT_RESULTS.md

  neural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements.txt
            requirements-neural.txt
            requirements-service.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-service.txt
      - run: RUN_DDP_INTEGRATION=1 python -m pytest -q tests/test_neural.py tests/test_service.py tests/test_benchmark_service.py tests/test_gpu_inference.py tests/test_gpu_report.py tests/test_distributed_training.py tests/test_ddp_artifacts.py tests/test_transformer_reranker.py tests/test_repository_evaluation.py
      - run: python -m src.run_neural --verify-only
      - run: python -m src.profile_gpu --verify-only --output reports/gpu_profile_audit
      - run: python -m src.validate_distributed --verify-only --output reports/ddp_cpu_reference
      - run: python -m src.validate_distributed --verify-only --output reports/ddp_cpu_validation
      - run: python -m src.run_transformer --verify-only
      - run: python -m src.evaluate_repository --verify-only
      - name: Rebuild nine-model evaluation
        run: python -m src.evaluate_repository --output /tmp/repository-evaluation
      - name: HTTP service smoke test
        run: python -m src.benchmark_service --requests 20 --concurrency 1 4 --repetitions 1 --output /tmp/service-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: inference-service-smoke
          path: /tmp/service-smoke/
